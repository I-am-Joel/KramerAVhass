set_route:
  target:
    device:
      integration: kramer
  fields:
    input:
      required: true
      example: "Input 003"
      selector:
        text:
    outputs:
      required: true
      example: '["Output 001", "2"]'
      selector:
        text:
          multiple: true

store_preset:
  target:
    device:
      integration: kramer
  fields:
    slot:
      required: true
      example: "12"
      selector:
        text:
    audio_only:
      required: false
      default: false
      selector:
        boolean:
    confirm_overwrite:
      required: false
      default: false
      selector:
        boolean:

recall_preset:
  target:
    device:
      integration: kramer
  fields:
    slot:
      required: true
      example: "12"
      selector:
        text:
    audio_only:
      required: false
      default: false
      selector:
        boolean:
