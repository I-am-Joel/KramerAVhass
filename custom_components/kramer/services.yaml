set_route:
  target: {}
  fields:
    input:
      required: true
      example: "Input 003"
      selector:
        text:
    outputs:
      required: true
      example: '["Output 001", "2"]'
      selector:
        text:
          multiple: true
    layer:
      required: false
      default: both
      selector:
        select:
          options:
            - both
            - video
            - audio
          translation_key: layer

store_preset:
  target: {}
  fields:
    preset:
      required: true
      example: "12"
      selector:
        text:
    audio_only:
      required: false
      default: false
      selector:
        boolean:
    confirm_overwrite:
      required: false
      default: false
      selector:
        boolean:

recall_preset:
  target: {}
  fields:
    preset:
      required: true
      example: "12"
      selector:
        text:
    audio_only:
      required: false
      default: false
      selector:
        boolean:

set_routing_mode:
  target: {}
  fields:
    mode:
      required: true
      selector:
        select:
          options:
            - afv
            - breakaway
          translation_key: routing_mode
